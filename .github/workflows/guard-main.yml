name: Guard main

# Server-side backstop for the one-decision-per-PR rule.
#
# main IS protected on GitHub now (PR required, force-push and deletion blocked),
# which became available when the repo went public. This workflow covers the two
# gaps that branch protection deliberately leaves:
#
#   1. repo admins are exempt from the branch rules
#   2. required_approving_review_count is 0, so a PR can be self-merged unreviewed
#
# So a commit can still reach main without review. This notices and says so.
#
# Alert-only by design: it never reverts or rewrites anyone's work.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to test detection against (reports only, opens no issue)'
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read   # required for /commits/{sha}/pulls; without it the
                        # lookup 403s and the guard cannot reach a conclusion

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Was this commit reviewed in a PR?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISPATCH_SHA: ${{ inputs.sha }}
          PUSH_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          DRY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -uo pipefail
          SHA="${DISPATCH_SHA:-$PUSH_SHA}"
          SHORT="${SHA:0:7}"
          echo "Checking $SHA (dry-run=$DRY)"

          # Keep the HTTP outcome separate from the answer. A failed lookup must
          # never be reported as "no PR" — that accuses someone of a direct push
          # when the truth is we could not check.
          COUNT=""
          for i in 1 2 3; do
            if OUT=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length' 2>/tmp/err); then
              COUNT="$OUT"
              if [ "$COUNT" != "0" ]; then break; fi
              if [ "$DRY" = "true" ]; then break; fi
              echo "no PR association yet (attempt $i) — waiting"
              sleep 5
            else
              echo "::warning::PR lookup failed (attempt $i): $(cat /tmp/err)"
              COUNT=""
              sleep 3
            fi
          done

          if [ -z "$COUNT" ]; then
            echo "::error::Could not determine whether $SHORT came from a PR — the lookup failed. This is NOT a finding about the commit."
            cat /tmp/err || true
            {
              echo "### Guard main could not run"
              echo "\`$SHORT\` — the PR lookup failed, so no conclusion was reached."
              echo "This is a workflow problem, not a policy violation."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          SUBJECT=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' 2>/dev/null | head -1)

          if [ "$COUNT" != "0" ]; then
            PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number' 2>/dev/null)
            echo "OK: $SHORT came from PR #$PR — reviewed"
            echo "\`$SHORT\` came from PR #$PR — reviewed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "FAIL: $SHORT has no associated PR — it went straight to main"
          {
            echo "### Direct push to main"
            echo "\`$SHORT\` — \"$SUBJECT\" by @$ACTOR, with no pull request."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY" = "true" ]; then
            echo "(dry run — no issue opened)"
            exit 1
          fi

          EXISTING=$(gh issue list --repo "$REPO" --state open --search "\"$SHORT\" in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf '`%s` landed on `main` without a pull request.\n\n> %s\n\nPushed by @%s.\n\n**Why this matters** — `main` requires a pull request, but repo admins are exempt from that rule, so an admin can still land a commit directly. This is the backstop for that case.\n\n**If the change is fine**, just close this. **If it should have been reviewed**, open a retrospective PR or revert it.\n\nNext time:\n\n    git config core.hooksPath .githooks\n    ./propose-tokens.sh "the decision"\n' "$SHA" "$SUBJECT" "$ACTOR")
            gh issue create --repo "$REPO" --title "Direct push to main: $SHORT" --body "$BODY" && echo "opened an issue"
          else
            echo "issue already open for $SHORT"
          fi
          exit 1
